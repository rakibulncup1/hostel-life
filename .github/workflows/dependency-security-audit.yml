name: Dependency security audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "15 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Enforce the patched Vite dev-server baseline
        run: npm run security:check

      - name: Audit production and development dependencies
        run: npm audit --audit-level=high
