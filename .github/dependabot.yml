version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Asia/Dhaka"
    open-pull-requests-limit: 5
    groups:
      production-dependencies:
        dependency-type: production
      development-toolchain:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: "Asia/Dhaka"
    open-pull-requests-limit: 5
